# Application & Environment Settings

spring:
  application:
    name: Mockify Backend

  profiles:
    default: local

  # Docker Configuration
  docker:
    compose:
      enabled: false

  # JPA & Hibernate Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  datasource:
    driver-class-name: org.postgresql.Driver

  jackson:
    time-zone: Asia/Kolkata

  # Database Migration (Flyway)
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  # OAuth 2 configuration (Google)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            client-name: Google
            authorization-grant-type: authorization_code
        provider:
          google:
            issuer-uri: https://accounts.google.com

  # Email / SMTP Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

 # Redis configuration
  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}

# Application-Specific Properties (Frontend)
app:
  frontend:
    url: http://localhost:3000
    reset-password-url: http://localhost:3000/reset-password
  verification:
    email:
      ttl-minutes: 30
      frontend-url: http://localhost:3000/verify-email
  api-key:
    secret: ${API_KEY_SECRET}
    max-per-organization: ${API_KEY_MAX_PER_ORG:50}

# Cleanup Scheduling
cleanup:
  password-token:
    enabled: true
    cron: "0 0 * * * *"   # every hour

  mock-data:
    enabled: true
    cron: "0 */10 * * * *" # every 10 minutes

  invitations:
    enabled: true
    cron: "0 0 * * * *"   # top of every hour

# Actuator configuration
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never


# Rate Limiting Configuration
mockify:
  rate-limit:
    # Global fallback to prevent volumetric DDoS and generic bot spam
    global:
      limit: 200
      window: 1m
      type: ip

    # ---------------------------------------------------------
    # SPECIFIC ENDPOINTS (Overrides group and global rules)
    # ---------------------------------------------------------
    endpoints:
      # Authentication - Strict limits to prevent brute force & enumeration
      login:
        path: /api/auth/login
        method: POST
        limit: 10
        window: 1m
        type: ip
      register:
        path: /api/auth/register
        method: POST
        limit: 5
        window: 10m
        type: ip
      forgot-password:
        path: /api/auth/forgot-password
        method: POST
        limit: 3
        window: 10m
        type: ip
      reset-password:
        path: /api/auth/reset-password
        method: POST
        limit: 5
        window: 10m
        type: ip
      refresh:
        path: /api/auth/refresh
        method: POST
        limit: 30      # Allows for concurrent tab token refreshing
        window: 1m
        type: ip
      logout:
        path: /api/auth/logout
        method: POST
        limit: 10
        window: 1m
        type: user

      # Heavy Data Operations - Prevent DB resource exhaustion
      bulk-insert:
        path: /api/*/*/*/records/bulk
        method: POST
        limit: 10      # Bulk operations are heavy, throttle tightly
        window: 1m
        type: user
      auto-bulk-insert:
        path: /api/*/*/*/records/auto-bulk
        method: POST
        limit: 5       # Automated generation is even heavier
        window: 1m
        type: user
      openapi-import:
        path: /api/*/*/import/openapi
        method: POST
        limit: 5       # Parsing large JSON/YAML files is CPU intensive
        window: 1m
        type: user

      # Sensitive Operations - Spam & Abuse prevention
      send-invite:
        path: /api/organizations/*/members/invite
        method: POST
        limit: 10      # Prevent email spamming
        window: 1m
        type: user
      accept-invite:
        path: /api/invitations/accept
        method: POST
        limit: 10
        window: 1m
        type: ip
      rotate-api-key:
        path: /api/*/api-keys/*/rotate
        method: POST
        limit: 5
        window: 1m
        type: user

    # ---------------------------------------------------------
    # ROUTE GROUPS (Broad rules for standard interactions)
    # ---------------------------------------------------------
    groups:
      # Public Mock Endpoints - Needs high throughput for actual API usage
      public-mock:
        paths:
          - /api/mock/**
        limit: 600     # Allow higher burst for mock consumption
        window: 1m
        type: ip       # If API keys are supported here, change to 'api-key' or 'user'

      # Standard Auth (Catches /api/auth/me and /api/auth/register/verify)
      auth-reads:
        paths:
          - /api/auth/**
        limit: 120     # High enough to allow SPAs to check session state frequently
        window: 1m
        type: ip

      # Dashboard - Analytical reads
      dashboard:
        paths:
          - /api/dashboard/**
        limit: 60
        window: 1m
        type: user

      # Structural CRUD - standard application usage
      organization:
        paths:
          - /api/organizations/**
        limit: 60
        window: 1m
        type: user

      # Project & Schema Management
      project-and-schema:
        paths:
          - /api/*/*             # Project CRUD
          - /api/*/projects/**
          - /api/*/*/schemas/**
        limit: 60
        window: 1m
        type: user

      # Standard Record CRUD (Single record operations)
      records:
        paths:
          - /api/*/*/*/records/**
        limit: 120
        window: 1m
        type: user

      # API Key Management (Reads and Creates)
      api-keys:
        paths:
          - /api/*/api-keys/**
          - /api/*/*/api-keys/**
        limit: 30
        window: 1m
        type: user

      # Lookup endpoints
      lookup:
        paths:
          - /api/endpoints/lookup/**
        limit: 120
        window: 1m
        type: ip

      # Admin - Internal tooling
      admin:
        paths:
          - /api/admin/**
        limit: 100
        window: 1m
        type: user

      # System / Devops
      actuator:
        paths:
          - /actuator/**
        limit: 30
        window: 1m
        type: ip